name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  # New data arrives as a merged pull request from update-data.yml, i.e. a push to web/.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # bin-links=false (web/.npmrc, for exFAT dev drives) is harmless here: scripts call node directly.
      - run: npm ci

      - name: Use sample data if the pipeline has not published any
        run: |
          if [ ! -f public/data/meta.json ]; then
            echo "::warning::web/public/data/meta.json missing – deploying with synthetic fixtures"
            npm run fixtures
          fi

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
